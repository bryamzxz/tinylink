#
# tinylink managed-component dependencies.
#
# trombik/esp_wireguard is the active port of smartalock/wireguard-lwip
# (BSD-3, ESP-IDF native, ~3500 LoC). It owns the WG data plane in M2.
# Picked over droscy/esp_wireguard because the latter has known build
# breaks under IDF v5.5 with TCPIP_CORE_LOCKING enabled (research
# artifact §B note); trombik works as-is under our sdkconfig.

dependencies:
  idf:
    version: ">=5.5,<5.6"
  trombik/esp_wireguard:
    version: "0.9.0"
