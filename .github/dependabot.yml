# Keep the GitHub Actions pins (checkout, upload-artifact, esp-idf-ci-action)
# current. ESP-IDF itself is deliberately pinned to v5.5.6 (see
# docs/BUILDING.md) and is NOT managed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
